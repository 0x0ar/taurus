bind=SUPER,Return,spawn,kitty
bind=SUPER,F,spawn,firefox
bind=SUPER,E,spawn,ski
bind=SUPER,BackSpace,toggle_scratchpad
bind=SUPER,Q,killclient
bind=SUPER+SHIFT,F,togglefloating

bind=NONE,XF86MonBrightnessDown,spawn,taurus brightness lower
bind=NONE,XF86MonBrightnessUp,spawn,taurus brightness raise

bind=NONE,Print,spawn,taurus screenshot
bind=SHIFT,Print,spawn,taurus screenshot --edit
bind=SUPER,Print,spawn,taurus screenshot --full
bind=SUPER+SHIFT,Print,spawn,taurus screenshot --full --edit

bind=NONE,XF86PowerOff,spawn,taurus lock
bind=SUPER,L,spawn,taurus lock

bind=SUPER,space,spawn,playerctl play-pause
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioMicMute,spawn,taurus volume mic-toggle
bind=NONE,XF86AudioMute,spawn,taurus volume mute-toggle
bind=NONE,XF86AudioLowerVolume,spawn,taurus volume lower
bind=NONE,XF86AudioRaiseVolume,spawn,taurus volume raise

bind=SUPER,R,spawn,taurus reload
bind=SUPER,C,spawn,taurus msg toggle clipboard
bind=SUPER,D,spawn,taurus msg toggle launcher
bind=SUPER,M,spawn,taurus msg toggle music
bind=SUPER,B,spawn,taurus msg toggle system
bind=SUPER,W,spawn,taurus msg toggle wallpaper
bind=SUPER,S,spawn,taurus msg toggle calendar
bind=SUPER,N,spawn,taurus msg toggle network
bind=SUPER,V,spawn,taurus msg toggle volume
bind=SUPER,H,spawn,taurus msg toggle settings
bind=SUPER,A,spawn,taurus msg bar autohide

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,viewtoleft
bind=SUPER,Down,viewtoright

# Mouse wheel: main wheel = workspaces (tags), thumb wheel (e.g. MX Master) = windows.
axisbind=SUPER,DOWN,viewtoright
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,RIGHT,focusdir,right
axisbind=SUPER,LEFT,focusdir,left

bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bindc=SUPER+CTRL,Up,tagtoleft
bindc=SUPER+CTRL,Up,viewtoleft
bindc=SUPER+CTRL,Down,tagtoright
bindc=SUPER+CTRL,Down,viewtoright

bind=SUPER+SHIFT,Left,setmfact,-0.05
bind=SUPER+SHIFT,Right,setmfact,+0.05
bind=SUPER+SHIFT,Up,resizewin,+0,-20
bind=SUPER+SHIFT,Down,resizewin,+0,+20

